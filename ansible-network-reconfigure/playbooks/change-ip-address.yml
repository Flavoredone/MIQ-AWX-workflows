---
- name: Simple IP Address Change
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  
  tasks:
    - name: Display current IP
      shell: ip addr show {{ target_interface }}
      register: ip_show
      changed_when: false
    
    - name: Show current IP info
      debug:
        msg: "Current IP on {{ target_interface }}: {{ ip_show.stdout }}"
    
    - name: Backup current netplan config
      copy:
        src: /etc/netplan/50-cloud-init.yaml
        dest: /tmp/50-cloud-init.yaml.backup
        remote_src: true
        backup: yes
    
    - name: Update Netplan config with new IP (preserving structure)
      replace:
        path: /etc/netplan/50-cloud-init.yaml
        regexp: '            dhcp4: true'
        replace: '            dhcp4: false\n            addresses: [{{ new_ip_address }}/24]'
    
    - name: Fix Netplan file permissions
      file:
        path: /etc/netplan/50-cloud-init.yaml
        mode: '0600'
        owner: root
        group: root
    
    - name: Apply network changes
      command: netplan apply
      become: true
    
    - name: Wait a bit for network
      pause:
        seconds: 5
    
    - name: Check new IP
      shell: ip -4 addr show {{ target_interface }} | grep inet | awk '{print $2}'
      register: new_ip
      changed_when: false
    
    - name: Show result
      debug:
        msg: "New IP: {{ new_ip.stdout }}"
