---
- name: Simple IP Address Change
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  
  tasks:
    - name: Display current IP
      shell: ip addr show {{ target_interface }}
      register: ip_show
      changed_when: false
    
    - name: Show current IP info
      debug:
        msg: "Current IP on {{ target_interface }}: {{ ip_show.stdout }}"
    
    - name: Create backup of network config
      copy:
        src: /etc/netplan/
        dest: /tmp/backup-netplan-{{ ansible_date_time.epoch }}
        remote_src: true
      ignore_errors: true
    
    - name: Update Netplan config with new IP
      lineinfile:
        path: /etc/netplan/50-cloud-init.yaml
        regexp: '      addresses:'
        line: "      addresses: [{{ new_ip_address }}/24]"
        backrefs: yes
      when: ansible_os_family == "Debian"
    
    - name: Update ifcfg file (RHEL/CentOS)
      lineinfile:
        path: "/etc/sysconfig/network-scripts/ifcfg-{{ target_interface }}"
        regexp: 'IPADDR='
        line: "IPADDR={{ new_ip_address }}"
      when: ansible_os_family == "RedHat"
    
    - name: Apply network changes
      command: netplan apply
      when: ansible_os_family == "Debian"
    
    - name: Restart network (RHEL/CentOS)
      service:
        name: network
        state: restarted
      when: ansible_os_family == "RedHat"
    
    - name: Wait a bit for network
      pause:
        seconds: 5
    
    - name: Check new IP
      shell: ip -4 addr show {{ target_interface }} | grep inet | awk '{print $2}'
      register: new_ip
      changed_when: false
    
    - name: Show result
      debug:
        msg: "New IP: {{ new_ip.stdout }}"
