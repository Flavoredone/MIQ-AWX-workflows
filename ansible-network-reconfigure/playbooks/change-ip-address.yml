---
- name: Simple IP Address Change
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  
  tasks:
    - name: Display current IP
      shell: ip addr show {{ target_interface }}
      register: ip_show
      changed_when: false
    
    - name: Show current IP info
      debug:
        msg: "Current IP on {{ target_interface }}: {{ ip_show.stdout }}"
    
    - name: Backup current netplan config
      copy:
        src: /etc/netplan/50-cloud-init.yaml
        dest: /tmp/50-cloud-init.yaml.backup
        remote_src: true
        backup: yes
    
    - name: Read current netplan config
      slurp:
        src: /etc/netplan/50-cloud-init.yaml
      register: netplan_content
    
    - name: Create new netplan config with static IP
      copy:
        content: "{{ (netplan_content.content | b64decode).replace('dhcp4: true', 'dhcp4: false\\n            addresses: [{{ new_ip_address }}/24]') }}"
        dest: /tmp/50-cloud-init.yaml.new
        mode: '0600'
    
    - name: Copy new config to netplan with sudo
      shell: |
        sudo cp /tmp/50-cloud-init.yaml.new /etc/netplan/50-cloud-init.yaml
        sudo chmod 600 /etc/netplan/50-cloud-init.yaml
        sudo chown root:root /etc/netplan/50-cloud-init.yaml
    
    - name: Apply network changes
      command: netplan apply
      become: true
    
    - name: Wait a bit for network
      pause:
        seconds: 5
    
    - name: Check new IP
      shell: ip -4 addr show {{ target_interface }} | grep inet | awk '{print $2}'
      register: new_ip
      changed_when: false
    
    - name: Show result
      debug:
        msg: "New IP: {{ new_ip.stdout }}"
