---
- name: Change IP Address with Connection Awareness
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  # vars:
  #   target_interface: "ens192"
  #   new_ip_address: "192.168.1.100"
  #   netmask: "255.255.255.0"
  #   backup_dir: "/tmp/backups"
  #   connection_ip: "10.31.137.238"  # Текущий IP для подключения
  
  tasks:
    - name: Validate required parameters
      fail:
        msg: "target_interface, new_ip_address, and netmask variables must be defined"
      when: 
        - target_interface is not defined
        - new_ip_address is not defined
        - netmask is not defined

    - name: Set connection IP fact
      set_fact:
        connection_ip: "{{ ansible_host }}"
    
    - name: Validate IP address format
      fail:
        msg: "IP address '{{ new_ip_address }}' is not a valid IPv4 address"
      when: not new_ip_address | ipv4
    
    - name: Validate netmask format
      fail:
        msg: "Netmask '{{ netmask }}' is not valid"
      when: not netmask | ipv4
    
    - name: Check if network interface exists
      shell: "ip link show {{ target_interface }}"
      register: interface_check
      ignore_errors: true
      changed_when: false
    
    - name: Fail if interface doesn't exist
      fail:
        msg: "Network interface '{{ target_interface }}' does not exist"
      when: interface_check.rc != 0
    
    - name: Get current IP address
      shell: "ip -4 addr show {{ target_interface }} | grep inet | awk '{print $2}' | cut -d/ -f1"
      register: current_ip
      changed_when: false
    
    - name: Check if we're changing the connection IP
      set_fact:
        changing_connection_ip: "{{ connection_ip == current_ip.stdout if current_ip.stdout is defined else false }}"
    
    - name: Display connection warning
      debug:
        msg: |
          WARNING: Changing connection IP address!
          - Current connection IP: {{ connection_ip }}
          - New IP: {{ new_ip_address }}
          - This will temporarily break SSH connection!
      when: changing_connection_ip | bool
    
    - name: Create backup directory
      file:
        path: "{{ backup_dir | default('/tmp/backups') }}"
        state: directory
        mode: '0755'
    
    - name: Display current IP information
      debug:
        msg: |
          Interface: {{ target_interface }}
          Current IP: {{ current_ip.stdout | default('not assigned') }}
          New IP: {{ new_ip_address }}/{{ netmask }}
          Connection IP: {{ connection_ip }}
    
    - name: Check if IP already assigned
      debug:
        msg: "IP address is already set to '{{ new_ip_address }}'. No changes needed."
      when: current_ip.stdout == new_ip_address
    
    - name: Abort if no changes needed
      meta: end_play
      when: current_ip.stdout == new_ip_address
    
    - name: Detect network configuration method
      block:
        - name: Check for Netplan
          stat:
            path: /etc/netplan
          register: netplan_check
        
        - name: Check for NetworkManager
          stat:
            path: /etc/NetworkManager
          register: nm_check
        
        - name: Check for systemd-networkd
          stat:
            path: /etc/systemd/network
          register: systemd_network_check
        
        - name: Set network manager fact
          set_fact:
            network_manager: >-
              {% if netplan_check.stat.exists %}netplan
              {% elif nm_check.stat.exists %}networkmanager
              {% elif systemd_network_check.stat.exists %}systemd-networkd
              {% else %}traditional{% endif %}
      rescue:
        - name: Set default network manager
          set_fact:
            network_manager: "traditional"
    
    - name: Display detected network manager
      debug:
        msg: "Detected network manager: {{ network_manager }}"
    
    - name: Backup Netplan configuration files
      block:
        - name: Find Netplan config files
          find:
            paths: /etc/netplan
            patterns: "*.yaml,*.yml"
            file_type: file
          register: netplan_files
        
        - name: Copy Netplan files to backup
          copy:
            src: "{{ item.path }}"
            dest: "{{ backup_dir | default('/tmp/backups') }}/netplan/{{ item.path | basename }}.backup"
            remote_src: true
          loop: "{{ netplan_files.files }}"
          when: netplan_files.files | length > 0
      when: netplan_check.stat.exists
    
    - name: Backup NetworkManager configuration
      block:
        - name: Backup NetworkManager connections
          shell: |
            mkdir -p {{ backup_dir | default('/tmp/backups') }}/NetworkManager/
            cp -r /etc/NetworkManager/system-connections/ {{ backup_dir | default('/tmp/backups') }}/NetworkManager/ 2>/dev/null || true
          args:
            warn: false
      when: nm_check.stat.exists
    
    - name: Backup traditional network configuration
      block:
        - name: Backup /etc/network/interfaces
          copy:
            src: /etc/network/interfaces
            dest: "{{ backup_dir | default('/tmp/backups') }}/interfaces.backup"
            remote_src: true
            backup: yes
          when: ansible_os_family == "Debian"
        
        - name: Backup network scripts (RHEL/CentOS)
          copy:
            src: "/etc/sysconfig/network-scripts/ifcfg-{{ target_interface }}"
            dest: "{{ backup_dir | default('/tmp/backups') }}/ifcfg-{{ target_interface }}.backup"
            remote_src: true
            backup: yes
          when: ansible_os_family == "RedHat"
      when: network_manager == "traditional"
    
    - name: Configure IP address via Netplan
      block:
        - name: Find existing Netplan config files
          find:
            paths: /etc/netplan
            patterns: "*.yaml,*.yml"
            file_type: file
          register: netplan_files
        
        - name: Apply IP change in Netplan
          lineinfile:
            path: "/etc/netplan/{{ netplan_files.files.0.path | basename }}"
            regexp: "      addresses: \\[.*\\]"
            line: "      addresses: [{{ new_ip_address }}/{{ netmask | ipaddr('prefix') }}]"
            backrefs: true
          when: netplan_files.files | length > 0
        
        - name: Apply Netplan configuration (async to avoid connection drop during play)
          command: netplan apply
          async: 45
          poll: 0
          when: not changing_connection_ip | bool
        
        - name: Apply Netplan configuration with connection awareness
          command: netplan apply
          when: changing_connection_ip | bool
      
      when: network_manager == "netplan"
    
    - name: Configure IP address via NetworkManager (using shell commands)
      block:
        - name: Get current NetworkManager connection
          shell: nmcli -t -f NAME con show --active
          register: nm_current_conn
          changed_when: false
          ignore_errors: true
        
        - name: Set NetworkManager connection name
          set_fact:
            nm_connection: "{{ nm_current_conn.stdout_lines[0] if nm_current_conn.stdout_lines and nm_current_conn.stdout_lines[0] != '' else target_interface }}"
        
        - name: Change IP address with NetworkManager using nmcli
          shell: |
            nmcli con mod "{{ nm_connection }}" ipv4.addresses "{{ new_ip_address }}/{{ netmask | ipaddr('prefix') }}"
            nmcli con mod "{{ nm_connection }}" ipv4.method manual
            {% if gateway is defined %}
            nmcli con mod "{{ nm_connection }}" ipv4.gateway "{{ gateway }}"
            {% endif %}
          args:
            warn: false
        
        - name: Restart NetworkManager connection (async if changing connection IP)
          shell: nmcli con down "{{ nm_connection }}" && nmcli con up "{{ nm_connection }}"
          async: 45
          poll: 0
          when: changing_connection_ip | bool
        
        - name: Restart NetworkManager connection (normal)
          shell: nmcli con down "{{ nm_connection }}" && nmcli con up "{{ nm_connection }}"
          when: not changing_connection_ip | bool
      
      when: network_manager == "networkmanager"
    
    - name: Configure IP address via traditional method (Debian/Ubuntu)
      block:
        - name: Update /etc/network/interfaces
          replace:
            path: /etc/network/interfaces
            regexp: '^\\s*address\\s+[0-9.]+'
            replace: '    address {{ new_ip_address }}'
          when: ansible_os_family == "Debian"
        
        - name: Update netmask in /etc/network/interfaces
          replace:
            path: /etc/network/interfaces
            regexp: '^\\s*netmask\\s+[0-9.]+'
            replace: '    netmask {{ netmask }}'
          when: ansible_os_family == "Debian"
        
        - name: Add gateway if specified
          lineinfile:
            path: /etc/network/interfaces
            line: '    gateway {{ gateway }}'
            insertafter: '^\\s*netmask'
          when: ansible_os_family == "Debian" and gateway is defined
        
        - name: Restart networking service (async if changing connection IP)
          service:
            name: networking
            state: restarted
          async: 45
          poll: 0
          when: changing_connection_ip | bool
        
        - name: Restart networking service (normal)
          service:
            name: networking
            state: restarted
          when: not changing_connection_ip | bool
      
      when: network_manager == "traditional" and ansible_os_family == "Debian"
    
    - name: Configure IP address via traditional method (RHEL/CentOS)
      block:
        - name: Update ifcfg file with new IP
          lineinfile:
            path: "/etc/sysconfig/network-scripts/ifcfg-{{ target_interface }}"
            regexp: '^IPADDR=.*'
            line: 'IPADDR={{ new_ip_address }}'
        
        - name: Update ifcfg file with netmask
          lineinfile:
            path: "/etc/sysconfig/network-scripts/ifcfg-{{ target_interface }}"
            regexp: '^NETMASK=.*'
            line: 'NETMASK={{ netmask }}'
        
        - name: Update ifcfg file with gateway
          lineinfile:
            path: "/etc/sysconfig/network-scripts/ifcfg-{{ target_interface }}"
            regexp: '^GATEWAY=.*'
            line: 'GATEWAY={{ gateway }}'
          when: gateway is defined
        
        - name: Ensure BOOTPROTO is static
          lineinfile:
            path: "/etc/sysconfig/network-scripts/ifcfg-{{ target_interface }}"
            regexp: '^BOOTPROTO=.*'
            line: 'BOOTPROTO=static'
            insertifabsent: true
        
        - name: Restart network service (async if changing connection IP)
          service:
            name: network
            state: restarted
          async: 45
          poll: 0
          when: changing_connection_ip | bool
        
        - name: Restart network service (normal)
          service:
            name: network
            state: restarted
          when: not changing_connection_ip | bool
      
      when: network_manager == "traditional" and ansible_os_family == "RedHat"
    
    - name: Final message for connection IP change
      debug:
        msg: |
          Network configuration applied successfully!
          SSH connection will switch to new IP: {{ new_ip_address }}
          Reconnecting to new address...
      when: changing_connection_ip | bool
    
    - name: Wait for network stabilization (only if not changing connection IP)
      wait_for_connection:
        timeout: 30
      become: false
      when: not changing_connection_ip | bool
    
    - name: Verify new IP address
      shell: "ip -4 addr show {{ target_interface }} | grep inet | awk '{print $2}' | cut -d/ -f1"
      register: new_ip_check
      changed_when: false
      when: not changing_connection_ip | bool
    
    - name: Display IP change results
      debug:
        msg: |
          IP address change completed:
          - Interface: {{ target_interface }}
          - New IP: {{ new_ip_check.stdout }}
          - Expected: {{ new_ip_address }}
          - Status: {{ 'SUCCESS' if new_ip_check.stdout == new_ip_address else 'FAILED' }}
      when: not changing_connection_ip | bool
    
    - name: Confirm IP change success
      assert:
        that:
          - new_ip_check.stdout == new_ip_address
        msg: "IP address change failed. Current: {{ new_ip_check.stdout }}, Expected: {{ new_ip_address }}"
      when: not changing_connection_ip | bool
    
    - name: Test network connectivity
      wait_for_connection:
        timeout: 15
      become: false
      ignore_errors: true
      when: not changing_connection_ip | bool
