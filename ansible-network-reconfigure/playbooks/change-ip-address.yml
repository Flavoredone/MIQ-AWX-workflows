---
- name: Simple IP Address Change
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  
  tasks:
    - name: Display current IP
      shell: ip addr show {{ target_interface }}
      register: ip_show
      changed_when: false
    
    - name: Show current IP info
      debug:
        msg: "Current IP on {{ target_interface }}: {{ ip_show.stdout }}"
    
    - name: Backup current netplan config
      shell: sudo cp /etc/netplan/50-cloud-init.yaml /tmp/50-cloud-init.yaml.backup
    
    - name: Update netplan config using sed
      shell: |
        sudo sed -i 's/dhcp4: true/dhcp4: false\n            addresses: [{{ new_ip_address }}\/24]/' /etc/netplan/50-cloud-init.yaml
        sudo chmod 600 /etc/netplan/50-cloud-init.yaml
    
    - name: Apply network changes
      shell: sudo netplan apply
    
    - name: Wait a bit for network
      pause:
        seconds: 5
    
    - name: Check new IP
      shell: ip -4 addr show {{ target_interface }} | grep inet | awk '{print $2}'
      register: new_ip
      changed_when: false
    
    - name: Show result
      debug:
        msg: "New IP: {{ new_ip.stdout }}"
