---
- name: Change IP via Netplan
  hosts: "{{ target_hosts | default('all') }}"
  become: true

  tasks:
    - name: Display current IP
      shell: ip addr show {{ target_interface }}
      register: ip_show
      changed_when: false

    - name: Show current network info
      debug:
        msg: |
          Current network configuration:
          {{ ip_show.stdout }}

    - name: Create static IP netplan config
      copy:
        content: |
          network:
            ethernets:
              {{ target_interface }}:
                dhcp4: false
                addresses:
                  - {{ new_ip_address }}/{{ subnet_prefix | default('24') }}
                {% if gateway is defined %}
                gateway4: {{ gateway }}
                {% endif %}
                nameservers:
                  addresses: [10.31.137.2]
                  search: [cloud.lab]
                match:
                  macaddress: {{ mac_address }}
                set-name: {{ target_interface }}
            version: 2
        dest: /etc/netplan/99-static-ip.yaml
        mode: '0600'

    - name: Apply netplan configuration
      command: netplan apply

    - name: Wait for network
      pause:
        seconds: 5

    - name: Check new IP
      shell: ip -4 addr show {{ target_interface }} | grep inet | awk '{print $2}'
      register: new_ip
      changed_when: false

    - name: Show result
      debug:
        msg: |
          IP change completed!
          New IP: {{ new_ip.stdout }}
